name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flask-hello-world .

      - name: Run container
        run: docker run -d -p 5000:5000 --name flask-app flask-hello-world

      - name: Wait for app to start
        run: sleep 3

      - name: Test endpoint
        run: curl --fail http://localhost:5000/

      - name: Stop container
        if: always()
        run: docker stop flask-app
